<svg xmlns="http://www.w3.org/2000/svg" width="400" height="148" viewBox="0 0 400 148" role="img" aria-labelledby="title desc">
  <title id="title">Pillow — PNG color profiles</title>
  <desc id="desc">Merged contribution #10646. Three color plates align beneath a landscape image.</desc>
  <defs>
    <linearGradient id="field" x2="1" y2=".75"><stop stop-color="#241e2d"/><stop offset="1" stop-color="#322733"/></linearGradient>
    <linearGradient id="rim" x2="1" y2=".85"><stop stop-color="#ae8c8e"/><stop offset=".54" stop-color="#4e535d"/><stop offset="1" stop-color="#ae8c8e"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#b67392" stop-opacity=".30"/><stop offset="1" stop-color="#b67392" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect x=".75" y=".75" width="398.5" height="146.5" rx="11"/></clipPath>
    <pattern id="grain" width="17" height="13" patternUnits="userSpaceOnUse"><path d="M3 3h1m8 6h.7" stroke="#c0c6bb" stroke-width=".7" opacity=".16"/></pattern>
    <linearGradient id="plate" x2=".72" y2="1"><stop stop-color="#413853"/><stop offset=".48" stop-color="#936d88"/><stop offset="1" stop-color="#c48f94"/></linearGradient>
    <linearGradient id="spectrum"><stop stop-color="#8a83c7"/><stop offset=".27" stop-color="#78a8d4"/><stop offset=".55" stop-color="#84c6b7"/><stop offset=".78" stop-color="#eec78c"/><stop offset="1" stop-color="#e89699"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="400" height="148" fill="url(#field)"/>
    <rect width="400" height="148" fill="url(#grain)"/>
    <ellipse cx="333" cy="73" rx="103" ry="93" fill="url(#halo)"/>
    <!-- Three separated color plates carry one composition. -->
    <g transform="matrix(.89 .31 -.53 .54 304 24)" stroke-linejoin="round">
      <g transform="translate(15 25)">
        <rect x="0" y="0" width="91" height="92" rx="1.8" fill="#485786" stroke="#b0abd9" stroke-width="1.7"/>
        <path d="M0 83h91v7H0z" fill="#9e9ad2"/>
      </g>
      <g transform="translate(8 13)">
        <rect width="91" height="92" rx="1.8" fill="#407079" stroke="#acccbe" stroke-width="1.7"/>
        <path d="M0 83h91v7H0z" fill="#80bdb0"/>
      </g>
      <rect width="91" height="92" rx="1.8" fill="#553c53" stroke="#ead0ba" stroke-width="1.8"/>
      <path d="M5 5h81v68H5z" fill="url(#plate)"/>
      <circle cx="65" cy="24" r="8" fill="#f3ceb1"/>
      <path d="M5 61l23-28 16 19 9-10 33 25v6H5z" fill="#63576f"/>
      <path d="M5 69l23-15 17 8 15-6 26 9v8H5z" fill="#a7b0b4"/>
      <path d="M5 82h81v5H5z" fill="url(#spectrum)"/>
    </g>
    <text x="19" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="33" letter-spacing="-1" fill="#fff0d9">Pillow</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="20" y="88" font-size="16.5" fill="#e1dfd8">PNG color profiles</text>
      <text x="42" y="122" font-size="15" font-weight="500" fill="#efc2ca">Merged #10646</text>
    </g>
    <g fill="#241e2d" stroke="#efc2ca" stroke-width="1.6" transform="translate(20 107)" stroke-linecap="round">
      <path d="M3 3v13M3 7c0 3 2 5 5 6l4 1"/><circle cx="3" cy="3" r="2"/><circle cx="3" cy="16" r="2"/><circle cx="13" cy="14" r="2"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="398.5" height="146.5" rx="11" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
</svg>
