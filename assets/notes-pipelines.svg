<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="124" viewBox="0 0 300 124" role="img" aria-labelledby="title desc">
  <title id="title">CPU pipelines</title>
  <desc id="desc">Three instructions overlap as they move through instruction fetch, decode, execute, memory access, and write-back.</desc>
  <defs>
    <linearGradient id="cover" x2="1" y2=".8">
      <stop stop-color="#123740"/><stop offset="1" stop-color="#202940"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0v12" fill="none" stroke="#53999f" stroke-opacity=".13"/>
    </pattern>
    <clipPath id="edge"><path d="M8 1h281l10 10v105l-7 7H8l-7-7V8z"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="300" height="124" fill="url(#cover)"/>
    <path d="M104 76h19v-6h18v-8h23v-6h29v-8h23v-8h18v-7h19v-6h25v-8h22v58z" fill="#53999f" opacity=".13"/>
    <path d="M157 77h22v-6h19v-5h24v-8h22v-5h25v-7h14v-4h17v35z" fill="#a9f0d9" opacity=".10"/>
    <path d="M0 0h300v77H0z" fill="url(#grid)"/>
    <g shape-rendering="crispEdges">
      <path d="M18 18h13v3H18zM34 18h4v3h-4z" fill="#a9f0d9"/>
      <!-- Consecutive instructions enter the same five stages one cycle apart. -->
      <defs>
        <g id="stages">
          <path d="M0 0h32v20H0z" fill="#88e2d2"/>
          <path d="M34 0h32v20H34z" fill="#a6cfed"/>
          <path d="M68 0h32v20H68z" fill="#c3bcec"/>
          <path d="M102 0h32v20h-32z" fill="#f0c48c"/>
          <path d="M136 0h32v20h-32z" fill="#e9a9bc"/>
        </g>
      </defs>
      <use xlink:href="#stages" transform="translate(58 16)"/>
      <use xlink:href="#stages" transform="translate(92 41) scale(1 .4)" opacity=".85"/>
      <use xlink:href="#stages" transform="translate(126 54) scale(1 .25)" opacity=".65"/>
      <g fill="#102b38" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-weight="700" font-size="12">
        <text x="74" y="30">IF</text><text x="108" y="30">ID</text><text x="142" y="30">EX</text>
        <text x="176" y="30">MEM</text><text x="210" y="30">WB</text>
      </g>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="18" y="47" fill="#a9f0d9" font-size="13" font-weight="600">ARCH</text>
    </g>
    <rect y="77" width="300" height="47" fill="#14172a"/>
    <path d="M0 77.5h300" stroke="#53999f" stroke-opacity=".65"/>
    <text x="18" y="108" fill="#fff8ef" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="650">CPU pipelines</text>
    <path d="M267 102h13m-5-5 5 5-5 5" fill="none" stroke="#a9f0d9" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <path d="M8 1h281l10 10v105l-7 7H8l-7-7V8z" fill="none" stroke="#53999f" stroke-width="2"/>
</svg>
