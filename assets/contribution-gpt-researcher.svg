      <g transform="translate(73 0)">
        <rect width="63" height="78" rx="2.5" fill="url(#table)" stroke="#a9d4c3" stroke-width="1.6"/>
        <path d="M1 3q0-2 2-2h57q2 0 2 2v15H1z" fill="#a4ceba"/>
        <path d="M1 38h61M1 58h61M25 18v59" fill="none" stroke="#88aaa1" stroke-width="1.2"/>
