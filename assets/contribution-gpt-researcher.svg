<svg xmlns="http://www.w3.org/2000/svg" width="400" height="148" viewBox="0 0 400 148" role="img" aria-labelledby="title desc">
  <title id="title">GPT Researcher — Streaming Markdown tables</title>
  <desc id="desc">Merged contribution #2325. Three streams of text resolve into a table with aligned rows and columns.</desc>
  <defs>
    <linearGradient id="field" x2="1" y2=".75"><stop stop-color="#15252d"/><stop offset="1" stop-color="#1c3034"/></linearGradient>
    <linearGradient id="rim" x2="1" y2=".85"><stop stop-color="#8f9e88"/><stop offset=".54" stop-color="#4e535d"/><stop offset="1" stop-color="#8f9e88"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#699c8c" stop-opacity=".30"/><stop offset="1" stop-color="#699c8c" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect x=".75" y=".75" width="398.5" height="146.5" rx="11"/></clipPath>
    <pattern id="grain" width="17" height="13" patternUnits="userSpaceOnUse"><path d="M3 3h1m8 6h.7" stroke="#c0c6bb" stroke-width=".7" opacity=".16"/></pattern>
    <linearGradient id="stream"><stop stop-color="#7db0a4" stop-opacity=".22"/><stop offset="1" stop-color="#c5e4bb"/></linearGradient>
    <linearGradient id="table" x2="1" y2="1"><stop stop-color="#43646a"/><stop offset="1" stop-color="#254449"/></linearGradient>
  </defs>
