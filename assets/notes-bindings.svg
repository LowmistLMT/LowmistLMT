<svg xmlns="http://www.w3.org/2000/svg" width="300" height="124" viewBox="0 0 300 124" role="img" aria-labelledby="title desc">
  <title id="title">C++ bindings</title>
  <desc id="desc">The elements of a tuple, 3 and 8, bind to the names x and y.</desc>
  <defs>
    <linearGradient id="cover" x2="1" y2=".8">
      <stop stop-color="#302646"/><stop offset="1" stop-color="#26233c"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0v12" fill="none" stroke="#997fbc" stroke-opacity=".13"/>
    </pattern>
    <clipPath id="edge"><path d="M8 1h281l10 10v105l-7 7H8l-7-7V8z"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="300" height="124" fill="url(#cover)"/>
    <path d="M104 76h19v-6h18v-8h23v-6h29v-8h23v-8h18v-7h19v-6h25v-8h22v58z" fill="#997fbc" opacity=".13"/>
    <path d="M157 77h22v-6h19v-5h24v-8h22v-5h25v-7h14v-4h17v35z" fill="#e3bbfc" opacity=".10"/>
    <path d="M0 0h300v77H0z" fill="url(#grid)"/>
    <g shape-rendering="crispEdges">
      <path d="M18 18h13v3H18zM34 18h4v3h-4z" fill="#e3bbfc"/>
      <!-- The two elements of a tuple are bound to separate names. -->
      <path d="M170 38h14V22h28m-28 16v16h28" fill="none" stroke="#c1a9e6" stroke-width="2"/>
      <path d="M108 26h61l3 3v17l-3 3h-61l-3-3V29z" fill="#322846" stroke="#d6afea" stroke-width="2"/>
      <path d="M211 11h58l3 3v14l-3 3h-58z" fill="#c7ace5"/>
      <path d="M211 45h58l3 3v14l-3 3h-58z" fill="#a9d3f0"/>
      <g font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-size="14" font-weight="700">
        <text x="139" y="43" fill="#f7deff">(3, 8)</text>
        <text x="242" y="26" fill="#302042">x = 3</text>
        <text x="242" y="60" fill="#172b42">y = 8</text>
      </g>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="18" y="47" fill="#e3bbfc" font-size="13" font-weight="600">CS106L</text>
    </g>
    <rect y="77" width="300" height="47" fill="#14172a"/>
    <path d="M0 77.5h300" stroke="#997fbc" stroke-opacity=".65"/>
    <text x="18" y="108" fill="#fff8ef" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="650">C++ bindings</text>
    <path d="M267 102h13m-5-5 5 5-5 5" fill="none" stroke="#e3bbfc" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <path d="M8 1h281l10 10v105l-7 7H8l-7-7V8z" fill="none" stroke="#997fbc" stroke-width="2"/>
</svg>
