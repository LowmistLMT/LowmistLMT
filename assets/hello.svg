    <!-- Two-color pixel lettering stays sharp without a web font. -->
    <use xlink:href="#name" transform="translate(65 95) scale(2)" fill="#9179ae"/>
    <use xlink:href="#name" transform="translate(61 89) scale(2)" fill="#fff1d6"/>
    <path d="M62 61l6 5-6 5" fill="none" stroke="#86dec2" stroke-width="3"/>
    <text x="80" y="72" fill="#9ce9d1" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">hello, world!</text>

