<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="272" viewBox="0 0 960 272" role="img" aria-labelledby="title desc">
  <title id="title">Hello, world! I'm lmtyy.</title>
  <desc id="desc">A pixel-art night sky behind a little coding desk. A ginger cat is curled up on a cream-colored computer with a blinking mint cursor.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#16192f"/>
      <stop offset=".58" stop-color="#292848"/>
      <stop offset="1" stop-color="#514066"/>
    </linearGradient>
    <pattern id="screen-lines" width="4" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 4.5h4" stroke="#9bf2ca" opacity=".1"/>
    </pattern>
    <path id="spark" d="M4 0h2v4h4v2H6v4H4V6H0V4h4z"/>
    <g id="name">
      <path id="letter-l" d="M0 0h12v36h6v6H0v-6h6V6H0z"/>
      <path d="M24 12h12v6h6v-6h12v6h6v24h-6V24h-6v18h-6V24h-6v18h-6V18h-6z"/>
      <path d="M72 0h6v12h12v6H78v18h12v6H78v-6h-6V18h-6v-6h6z"/>
      <path id="letter-y" d="M96 12h6v18h12V12h6v30h-6v6H96v-6h12v-6h-6v-6h-6z"/>
      <use xlink:href="#letter-y" x="30"/>
    </g>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .cursor { animation: blink 1.6s step-end infinite; }
        .distant-stars { animation: glow 5s ease-in-out infinite alternate; }
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 65% { opacity: 0; } }
      @keyframes glow { from { opacity: .45; } to { opacity: .95; } }
    </style>
  </defs>
  <rect width="960" height="272" fill="url(#sky)"/>
  <g shape-rendering="crispEdges">
    <!-- Stars and a stepped crescent. -->
    <path fill="#aa9cba" d="M23 27h2v2h-2zM97 38h3v3h-3zM164 19h2v2h-2zM231 50h2v2h-2zM299 24h3v3h-3zM374 53h2v2h-2zM435 27h2v2h-2zM467 103h3v3h-3zM525 63h2v2h-2zM552 124h2v2h-2zM625 17h3v3h-3zM650 65h2v2h-2zM728 29h3v3h-3zM808 22h2v2h-2zM894 110h2v2h-2zM927 28h2v2h-2z"/>
