<svg xmlns="http://www.w3.org/2000/svg" width="300" height="124" viewBox="0 0 300 124" role="img" aria-labelledby="title desc">
  <title id="title">Red-black trees</title>
  <desc id="desc">A two-key node labeled 3 and 8 maps to a black node 8 with a left red link to node 3.</desc>
  <defs>
    <linearGradient id="cover" x2="1" y2=".8">
      <stop stop-color="#3e2336"/><stop offset="1" stop-color="#272039"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0v12" fill="none" stroke="#b27789" stroke-opacity=".13"/>
    </pattern>
    <clipPath id="edge"><path d="M8 1h281l10 10v105l-7 7H8l-7-7V8z"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="300" height="124" fill="url(#cover)"/>
    <path d="M104 76h19v-6h18v-8h23v-6h29v-8h23v-8h18v-7h19v-6h25v-8h22v58z" fill="#b27789" opacity=".13"/>
    <path d="M157 77h22v-6h19v-5h24v-8h22v-5h25v-7h14v-4h17v35z" fill="#ffd0b3" opacity=".10"/>
    <path d="M0 0h300v77H0z" fill="url(#grid)"/>
    <g shape-rendering="crispEdges">
      <path d="M18 18h13v3H18zM34 18h4v3h-4z" fill="#ffd0b3"/>
      <!-- A two-key 2–3 tree node and its left-leaning red-black encoding. -->
      <path fill="#23192c" stroke="#ebacac" stroke-width="2" d="M108 29h56v26h-56z"/>
      <path d="M136 30v24" stroke="#af7581" stroke-width="2"/>
      <path d="M173 41h21m-5-5 5 5-5 5" fill="none" stroke="#f6c99d" stroke-width="2"/>
      <path d="M223 53l28-28" stroke="#f66a89" stroke-width="5"/>
      <path d="M248 10h18l3 3v16l-3 3h-18l-3-3V13z" fill="#201c29" stroke="#ffe0b8" stroke-width="2"/>
      <path d="M212 47h18l3 3v16l-3 3h-18l-3-3V50z" fill="#aa375d" stroke="#ff99ac" stroke-width="2"/>
      <g fill="#ffebd9" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-weight="700" font-size="15">
        <text x="122" y="47">3</text><text x="150" y="47">8</text>
        <text x="257" y="26">8</text><text x="221" y="63">3</text>
      </g>
    </g>
    <g font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="18" y="47" fill="#ffd0b3" font-size="13" font-weight="600">CS61B</text>
    </g>
    <rect y="77" width="300" height="47" fill="#14172a"/>
    <path d="M0 77.5h300" stroke="#b27789" stroke-opacity=".65"/>
    <text x="18" y="108" fill="#fff8ef" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="650">Red-black trees</text>
    <path d="M267 102h13m-5-5 5 5-5 5" fill="none" stroke="#ffd0b3" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <path d="M8 1h281l10 10v105l-7 7H8l-7-7V8z" fill="none" stroke="#b27789" stroke-width="2"/>
</svg>
